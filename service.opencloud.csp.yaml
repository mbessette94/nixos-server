# OpenCloud's Content-Security-Policy config (see PROXY_CSP_CONFIG_FILE_LOCATION
# in service.opencloud.nix). This is upstream's default
# (services/proxy/pkg/config/csp.yaml in opencloud-eu/opencloud) with
# id.@DOMAIN@ (pocket-id, a different origin) added to connect-src (the
# OIDC well-known discovery fetch) and frame-src (silent-renew iframe).
# Without it, the browser's own CSP blocks the well-known lookup and login
# just hangs on the loader.
#
# @DOMAIN@ is substituted with vars.domain by service.opencloud.nix.
directives:
  child-src:
    - '''self'''
  connect-src:
    - '''self'''
    - 'blob:'
    - 'https://raw.githubusercontent.com/opencloud-eu/awesome-apps/'
    - 'https://update.opencloud.eu/'
    - 'https://id.@DOMAIN@'
  default-src:
    - '''none'''
  font-src:
    - '''self'''
  frame-ancestors:
    - '''self'''
  frame-src:
    - '''self'''
    - 'blob:'
    - 'https://embed.diagrams.net/'
    - 'https://id.@DOMAIN@'
  img-src:
    - '''self'''
    - 'data:'
    - 'blob:'
    - 'https://raw.githubusercontent.com/opencloud-eu/awesome-apps/'
  manifest-src:
    - '''self'''
  media-src:
    - '''self'''
  object-src:
    - '''self'''
    - 'blob:'
  script-src:
    - '''self'''
    - '''unsafe-inline'''
  style-src:
    - '''self'''
    - '''unsafe-inline'''
