http:
  routers:
    neko-ws:
      rule: "Host(`vbrowser.thiccdata.io`) && HeaderRegexp(`Upgrade`, `(?i)websocket`)"
      entryPoints:
        - "websecure"
      tls: {}
      priority: 100
      service: neko
    # 2. THE PROTECTED UI (Requires Forward Auth)
    neko-ui:
      rule: "Host(`vbrowser.thiccdata.io`)"
      entryPoints:
        - "websecure"
      tls: {}
      priority: 10
      middlewares:
        - "base-secure@file"
      service: neko
  services:
    neko:
      loadbalancer:
        servers:
          - url: http://172.22.0.11:8080
        responseForwarding:
          flushInterval: 100ms