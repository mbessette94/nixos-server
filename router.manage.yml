http:
  routers:
    dns:
      rule: "Host(\"manage.thiccdata.io\")"
      service: cockpit
      middlewares:
        - "internal-secure@file"
      entryPoints:
        - websecure
      tls:
        certresolver: myresolver
  services:
    cockpit:
      loadbalancer:
        servers:
          - url: http://127.0.0.1:9090
