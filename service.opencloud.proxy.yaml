# OpenCloud proxy service config -- additional routes for the CalDAV/CardDAV
# (Radicale) integration. See service.opencloud.nix (radicale container,
# private-net only) and service.opencloud.radicale.conf (Radicale's own
# config). This is opencloud-eu/opencloud-compose's config/opencloud/
# proxy.yaml verbatim -- the reference deployment for this exact
# integration -- kept as-is for easy diffing against upstream.
#
# Auto-loaded from /etc/opencloud/proxy.yaml the same way opencloud.yaml and
# csp.yaml are -- no extra env var needed to point the proxy service at it.
#
# This adds four additional routes to the proxy. Forwarding
# request on '/carddav/', '/caldav/' and the respective '/.well-knwown'
# endpoints to the radicale container and setting the required headers.
additional_policies:
  - name: default
    routes:
      - endpoint: /caldav/
        backend: http://radicale:5232
        remote_user_header: X-Remote-User
        skip_x_access_token: true
        additional_headers:
          - X-Script-Name: /caldav
      - endpoint: /.well-known/caldav
        backend: http://radicale:5232
        remote_user_header: X-Remote-User
        skip_x_access_token: true
        additional_headers:
          - X-Script-Name: /caldav
      - endpoint: /carddav/
        backend: http://radicale:5232
        remote_user_header: X-Remote-User
        skip_x_access_token: true
        additional_headers:
          - X-Script-Name: /carddav
      - endpoint: /.well-known/carddav
        backend: http://radicale:5232
        remote_user_header: X-Remote-User
        skip_x_access_token: true
        additional_headers:
          - X-Script-Name: /carddav
