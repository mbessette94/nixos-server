http:
  routers:
    dns:
      rule: "Host(\"dns.thiccdata.io\")"
      service: technitium
      middlewares:
        - "internal-secure@file"
      entryPoints:
        - websecure
      tls:
        certresolver: myresolver
  services:
    technitium:
      loadbalancer:
        servers:
          - url: http://192.168.1.200:5380