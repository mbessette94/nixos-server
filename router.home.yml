http:
  routers:
    homeassistant:
      rule: "Host(`home.thiccdata.io`)"
      service: homeassistant
      middlewares:
        - "internal-secure@file"
      entryPoints:
        - websecure
      tls:
        certresolver: myresolver

  services:
    homeassistant:
      loadBalancer:
        servers:
          - url: "http://192.168.3.45:8123"
